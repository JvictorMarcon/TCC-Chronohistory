<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronohistory — Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/medieval.css" />
    <link rel="stylesheet" href="css/cadastro.css" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preload" href="assets/herois-vortice.webp" as="image" type="image/webp" />
  </head>
  <body>
    <div class="auth-split">
      <!-- LADO DO FORMULÁRIO -->
      <div class="auth-form-side">
        <div class="auth-shell">
          <!-- PAINEL DA IMAGEM -->
          <div class="auth-panel-media">
            <img src="assets/herois-vortice.webp" alt="" class="auth-panel-img" loading="eager" decoding="async" />
            <div class="auth-panel-media-overlay"></div>
            <div class="auth-panel-caption">
              <span class="auth-panel-caption-title">Comece sua jornada</span>
              <span class="auth-panel-caption-sub">Crie sua conta e explore a história como nunca antes</span>
            </div>
          </div>

          <!-- PAINEL DO FORMULÁRIO -->
          <div class="auth-panel-form">
            <a href="index.html" class="back-button" title="Voltar para a Página Inicial">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
              </svg>
              <span>Voltar</span>
            </a>

            <a href="index.html" class="login-logo">
              <img src="assets/logo.png" alt="Chronohistory Logo" />
              <h1>CHRONOHISTORY</h1>
              <span>Criar Conta</span>
            </a>

            <h2 class="auth-panel-title">Crie sua conta</h2>

            <!-- FORMULÁRIO DE REGISTRO -->
            <form class="login-form" id="registerForm" novalidate>
              <div class="form-group">
                <label for="fullname">Nome Completo</label>
                <div class="input-icon-field">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                  </svg>
                  <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Digite seu nome completo"
                    required
                    autocomplete="name"
                    pattern="[A-Za-zÀ-ÖØ-öø-ÿ' -]+"
                    title="Use apenas letras e espaços"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="username">Usuário de Acesso</label>
                <div class="input-icon-field">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                  </svg>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Escolha um nome de usuário"
                    required
                    autocomplete="username"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="email">E-mail</label>
                <div class="input-icon-field">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                  </svg>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    required
                    autocomplete="email"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-icon-field">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                  </svg>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Entre 8 e 20 caracteres"
                    required
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="20"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <div class="input-icon-field">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                  </svg>
                  <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repita a senha"
                    required
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="20"
                  />
                </div>
              </div>

              <button type="submit" class="btn-login" id="submitBtn">
                <span>Cadastrar-se</span>
              </button>
            </form>

            <!-- RODAPÉ DO CARD -->
            <div class="login-footer">
              Já possui uma conta?
              <a href="login.html" class="signup-link">Faça login aqui</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS DE REGISTRO -->
    <script>
      const API_URL = "https://backend-tcc-cronohistory.onrender.com";

      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("registerForm");
        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          const fullname = document.getElementById("fullname").value.trim();
          const username = document.getElementById("username").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const confirmPassword = document.getElementById("confirmPassword").value;
          const btn = document.getElementById("submitBtn");

          if (!fullname || !username || !email || !password || !confirmPassword) {
            alert("Preencha todos os campos obrigatórios.");
            return;
          }

          const nomeValido = /^[A-Za-zÀ-ÖØ-öø-ÿ' -]+$/.test(fullname);
          if (!nomeValido) {
            alert("O nome deve conter apenas letras e espaços.");
            return;
          }

          const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          if (!emailValido) {
            alert("Informe um e-mail em um formato válido (ex.: usuario@email.com).");
            return;
          }

          if (password.length < 8 || password.length > 20) {
            alert("A senha deve ter entre 8 e 20 caracteres.");
            return;
          }

          if (password !== confirmPassword) {
            alert("As senhas não coincidem. Confira e tente novamente.");
            return;
          }

          btn.disabled = true;
          btn.innerHTML = "<span>Cadastrando...</span>";

          const payload = JSON.stringify({
            nome: fullname,
            user: username,
            email: email,
            password: password,
            perfil: "aluno",
          });

          try {
            const response = await fetch(`${API_URL}/cadastro`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: payload,
            });

            const data = await response.json();

            if (response.ok && data.status === "success") {
              const role = (data.role || data.user?.role || "aluno").toLowerCase();

              // Mesmo padrão do login.html: salva a sessão local pra já entrar logado
              localStorage.setItem("chronohistory_token", data.token || "sessao_ativa");
              localStorage.setItem(
                "chronohistory_user",
                JSON.stringify({
                  user: data.user?.user || username,
                  nome: data.user?.nome || fullname,
                  role: role,
                  fase_jogo: data.user?.fase_jogo || 1,
                }),
              );
              sessionStorage.setItem("chronohistory_welcome", username);
              window.location.href = "linha-do-tempo.html";
              return;
            } else if (response.status === 400) {
              // Usuário ou e-mail duplicado, ou erro de validação
              alert(
                data.message ||
                  "Erro ao realizar o cadastro. Tente outro nome de usuário.",
              );
            } else {
              console.error("Erro de cadastro:", data.message || response.status);
              alert(
                "Não foi possível se conectar ao servidor. Verifique sua conexão e tente novamente.",
              );
            }
          } catch (error) {
            console.error("Erro de cadastro:", error.message);
            alert(
              "Não foi possível se conectar ao servidor. Verifique sua conexão e tente novamente.",
            );
          }

          btn.disabled = false;
          btn.innerHTML = "<span>Cadastrar-se</span>";
        });
      });
    </script>

    <!-- ═══ PARTÍCULAS MEDIEVAIS ═══ -->
    <script>
      (function () {
        var particleSymbols = ["✦", "✧", "⬥", "⬦", "◆", "◇", "⚜"];
        var colors = ["#C9A227", "#8B6914", "#A68A56", "#6B4F0E"];

        function createParticle() {
          var p = document.createElement("div");
          p.className = "medieval-particle";
          p.textContent = particleSymbols[Math.floor(Math.random() * particleSymbols.length)];
          p.style.left = Math.random() * 100 + "vw";
          p.style.bottom = "-20px";
          p.style.color = colors[Math.floor(Math.random() * colors.length)];
          p.style.animationDuration = 6 + Math.random() * 10 + "s";
          p.style.animationDelay = Math.random() * 4 + "s";
          p.style.fontSize = 8 + Math.random() * 10 + "px";
          p.style.opacity = "0";
          document.body.appendChild(p);
          setTimeout(function () {
            if (p.parentNode) p.parentNode.removeChild(p);
          }, 18000);
        }

        setInterval(createParticle, 2200);
        for (var i = 0; i < 5; i++) {
          setTimeout(createParticle, i * 400);
        }
      })();
    </script>
  </body>
</html>
