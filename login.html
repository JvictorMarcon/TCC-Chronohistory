<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronohistory — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/medieval.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="preload" href="assets/herois-vortice.webp" as="image" type="image/webp">
</head>
<body>

    <div class="auth-split">
        <!-- LADO DO FORMULÁRIO -->
        <div class="auth-form-side">
            <div class="auth-shell">
                <!-- PAINEL DA IMAGEM -->
                <div class="auth-panel-media">
                    <img src="assets/herois-vortice.webp" alt="" class="auth-panel-img" loading="eager" decoding="async">
                    <div class="auth-panel-media-overlay"></div>
                    <div class="auth-panel-caption">
                        <span class="auth-panel-caption-title">Bem-vindo de volta</span>
                        <span class="auth-panel-caption-sub">Entre para continuar sua jornada pela história</span>
                    </div>
                </div>

                <!-- PAINEL DO FORMULÁRIO -->
                <div class="auth-panel-form">
                    <a href="index.html" class="back-button" title="Voltar para a Página Inicial">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                        <span>Voltar</span>
                    </a>

                    <a href="index.html" class="login-logo">
                        <img src="assets/logo.png" alt="Chronohistory Logo">
                        <h1>CHRONOHISTORY</h1>
                        <span>Linha do Tempo</span>
                    </a>

                    <h2 class="auth-panel-title">Entrar na sua conta</h2>

                    <!-- FORMULÁRIO -->
                    <form class="login-form" id="loginForm">
                        <div class="form-group">
                            <label for="username">Usuário</label>
                            <div class="input-icon-field">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autocomplete="username">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Senha</label>
                            <div class="input-icon-field">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                </svg>
                                <input type="password" id="password" name="password" class="has-toggle" placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha" title="Mostrar senha">
                                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                                        <path d="M17.94 17.94A10.94 10.94 0 0112 20c-7 0-11-8-11-8a21.27 21.27 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 8 11 8a21.27 21.27 0 01-3.22 4.44"></path>
                                        <path d="M14.12 14.12a3 3 0 11-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="remember" name="remember">
                                Lembrar de mim
                            </label>

                            <a href="esqueci-senha.html" class="forgot-link">Esqueceu a senha?</a>
                        </div>

                        <button type="submit" class="btn-login" id="submitBtn">
                            <span>Entrar</span>
                        </button>
                    </form>

                    <!-- RODAPÉ DO CARD -->
                    <div class="login-footer">
                        Não possui uma conta? <a href="cadastro.html" class="signup-link">Cadastre-se aqui</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS DE AUTENTICAÇÃO -->
    <script>
        const API_URL = 'https://backend-tcc-cronohistory.onrender.com';

        document.addEventListener('DOMContentLoaded', () => {
            // O formulário precisa ficar pronto para uso imediatamente,
            // independente do resultado da checagem de sessão abaixo.
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const usernameInput = document.getElementById('username').value.trim();
                const passwordInput = document.getElementById('password').value.trim();
                const btn = document.getElementById('submitBtn');

                if (!usernameInput || !passwordInput) {
                    alert('Por favor, preencha todos os campos.');
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<span>Verificando...</span>';

                try {
                    const response = await fetch(`${API_URL}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            user: usernameInput,
                            password: passwordInput
                        })
                    });

                    const data = await response.json();

                    if (response.ok && (data.status === 'success' || data.token)) {
                        const role = (data.role || data.user?.role || 'aluno').toLowerCase();

                        // Salva no localStorage como fallback visual (sessão real fica no cookie/JWT do backend)
                        localStorage.setItem('chronohistory_token', data.token || 'sessao_ativa');
                        localStorage.setItem('chronohistory_user', JSON.stringify({
                            user: data.user?.user || usernameInput,
                            nome: data.user?.nome || usernameInput,
                            role: role,
                            fase_jogo: data.user?.fase_jogo || 1
                        }));
                        sessionStorage.setItem('chronohistory_welcome', data.user?.user || usernameInput);

                        window.location.href = role === 'adm' ? 'adm.html' : 'linha-do-tempo.html';
                        return;
                    } else if (response.status === 401) {
                        alert(data.message || 'Usuário ou senha incorretos.');
                    } else {
                        alert(data.message || 'Não foi possível fazer login. Tente novamente.');
                    }
                } catch (error) {
                    console.warn('Falha ao conectar com o servidor:', error);
                    alert('Não foi possível se conectar ao servidor. Verifique sua conexão e tente novamente.');
                }

                btn.disabled = false;
                btn.innerHTML = '<span>Entrar</span>';
            });

            // Verificar se já há sessão ativa ao abrir a página (não bloqueia o formulário acima)
            const params = new URLSearchParams(window.location.search);
            if (params.get('logout') === '1') return; // evita loop de redirect logo após sair

            fetch(`${API_URL}/me`, { credentials: 'include' })
                .then(resp => resp.ok ? resp.json() : null)
                .then(sessao => {
                    if (sessao && sessao.autenticado) {
                        window.location.href = sessao.role === 'adm' ? 'adm.html' : 'linha-do-tempo.html';
                    }
                })
                .catch(() => {});
        });
    </script>

    <!-- ═══ PARTÍCULAS MEDIEVAIS ═══ -->
    <script>
        (function () {
            var particleSymbols = ['✦', '✧', '⬥', '⬦', '◆', '◇', '⚜'];
            var colors = ['#C9A227', '#8B6914', '#A68A56', '#6B4F0E'];

            function createParticle() {
                var p = document.createElement('div');
                p.className = 'medieval-particle';
                p.textContent = particleSymbols[Math.floor(Math.random() * particleSymbols.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.bottom = '-20px';
                p.style.color = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = 6 + Math.random() * 10 + 's';
                p.style.animationDelay = Math.random() * 4 + 's';
                p.style.fontSize = 8 + Math.random() * 10 + 'px';
                p.style.opacity = '0';
                document.body.appendChild(p);
                setTimeout(function () {
                    if (p.parentNode) p.parentNode.removeChild(p);
                }, 18000);
            }

            setInterval(createParticle, 2200);
            for (var i = 0; i < 5; i++) {
                setTimeout(createParticle, i * 400);
            }
        })();
    </script>
    <script src="js/password-toggle.js"></script>
</body>
</html>
