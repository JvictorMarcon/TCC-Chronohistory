<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronohistory — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/medieval.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/png" href="logo.png" />
</head>
<body>

    <!-- VÍDEO DE FUNDO -->
    <div class="video-bg-container">
        <video autoplay muted loop playsinline preload="auto">
            <source src="../vei.mp4" type="video/mp4">
        </video>
        <div class="video-bg-overlay"></div>
    </div>

    <!-- CONTAINER DO LOGIN -->
    <div class="login-wrapper">
        <a href="../index.html" class="back-button" title="Voltar para a Página Inicial">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
            <span>Voltar</span>
        </a>
        <div class="login-card">

            <div class="login-ornament">Portal de Acesso</div>

            <a href="../index.html" class="login-logo">
                <img src="../logo.png" alt="Chronohistory Logo">
                <h1>CHRONOHISTORY</h1>
                <span>Linha do Tempo</span>
            </a>

            <!-- FORMULÁRIO -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <svg class="w-4 h-4 text-gold inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Usuário ou E-mail
                    </label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">
                        <svg class="w-4 h-4 text-gold inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        Senha
                    </label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        Lembrar de mim
                    </label>

                    <a href="#" class="forgot-link" onclick="alert('Entre em contato com o suporte para redefinir sua senha.'); return false;">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <span>Entrar</span>
                </button>
            </form>

            <!-- RODAPÉ DO CARD -->
            <div class="login-footer">
                Não possui uma conta? <a href="cadastro.html" class="signup-link">Cadastre-se aqui</a>
            </div>

        </div>
    </div>

    <!-- SCRIPTS DE AUTENTICAÇÃO -->
    <script>
        const API_URL = 'https://backend-tcc-cronohistory.onrender.com';
        const API_URL_LOCAL = 'http://localhost:5000';

        // Verificar se já há sessão ativa ao abrir a página
        document.addEventListener('DOMContentLoaded', async () => {
            // Se viemos de um logout, não fazer auto-redirect (evita loop)
            const params = new URLSearchParams(window.location.search);
            if (params.get('logout') === '1') return;

            const urlsTentar = [API_URL, API_URL_LOCAL];
            for (const url of urlsTentar) {
                try {
                    const resp = await fetch(`${url}/me`, { credentials: 'include' });
                    if (resp.ok) {
                        const sessao = await resp.json();
                        if (sessao.autenticado) {
                            window.location.href = sessao.role === 'adm' ? 'adm.html' : '../index.html';
                            return;
                        }
                    }
                } catch (_) {}
            }

            const form = document.getElementById('loginForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const usernameInput = document.getElementById('username').value.trim();
                const passwordInput = document.getElementById('password').value.trim();
                const btn = document.getElementById('submitBtn');

                if (!usernameInput || !passwordInput) {
                    alert('Por favor, preencha todos os campos.');
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<span>Verificando...</span>';

                let loginSucesso = false;
                const urlsLogin = [API_URL, API_URL_LOCAL];

                for (const url of urlsLogin) {
                    try {
                        const response = await fetch(`${url}/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({
                                user: usernameInput,
                                password: passwordInput
                            })
                        });

                        const data = await response.json();

                        if (response.ok && (data.status === 'success' || data.token)) {
                            const role = (data.role || data.user?.role || 'aluno').toLowerCase();
                            
                            // Salva no localStorage como fallback visual
                            localStorage.setItem('chronohistory_token', data.token || 'sessao_ativa');
                            localStorage.setItem('chronohistory_user', JSON.stringify({
                                user: data.user?.user || usernameInput,
                                nome: data.user?.nome || usernameInput,
                                role: role,
                                fase_jogo: data.user?.fase_jogo || 1
                            }));

                            loginSucesso = true;
                            window.location.href = role === 'adm' ? 'adm.html' : '../index.html';
                            return;
                        } else if (response.status === 401) {
                            alert(data.message || 'Usuário ou senha incorretos.');
                            btn.disabled = false;
                            btn.innerHTML = '<span>Entrar</span>';
                            return;
                        }
                    } catch (error) {
                        console.warn(`Tentativa com ${url} falhou:`, error);
                    }
                }

                // Se chegou aqui, nenhuma URL funcionou - tenta fallback local
                if (!loginSucesso) {
                    console.warn('Backend indisponível. Login local ativado.');
                    const isAdm = (
                        usernameInput.toLowerCase() === 'admin' ||
                        usernameInput.toLowerCase() === 'adm' ||
                        usernameInput === 'CR0N0H1ST0R7'
                    );
                    const role = isAdm ? 'adm' : 'aluno';

                    localStorage.setItem('chronohistory_token', 'local_token_' + Date.now());
                    localStorage.setItem('chronohistory_user', JSON.stringify({
                        user: usernameInput,
                        nome: isAdm ? 'Administrador' : usernameInput,
                        role: role,
                        fase_jogo: 1
                    }));

                    window.location.href = role === 'adm' ? 'adm.html' : '../index.html';
                }
            });
        });
    </script>
</body>
</html>
