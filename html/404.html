<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronohistory - Página Não Encontrada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1410;
        position: relative;
        overflow: hidden;
      }

      /* ===== VÍDEO DE FUNDO ===== */
      .video-bg-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        overflow: hidden;
      }

      .video-bg-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .video-bg-overlay {
        position: absolute;
        inset: 0;
        background: rgba(20, 15, 10, 0.82);
        background-image: radial-gradient(
          circle at 30% 40%,
          rgba(139, 105, 20, 0.12) 0%,
          transparent 60%
        );
      }

      /* ===== PARTÍCULAS ===== */
      .medieval-particle {
        position: fixed;
        pointer-events: none;
        z-index: 1;
        font-family: "Inter", sans-serif;
        user-select: none;
        animation: floatUp linear infinite;
        opacity: 0;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) rotate(0deg) scale(0.6);
          opacity: 0;
        }

        10% {
          opacity: 0.6;
        }

        90% {
          opacity: 0.4;
        }

        100% {
          transform: translateY(-110vh) rotate(720deg) scale(1.2);
          opacity: 0;
        }
      }

      /* ===== CONTEÚDO PRINCIPAL ===== */
      .error-wrapper {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 600px;
        padding: 1.5rem;
        animation: fadeSlideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes fadeSlideUp {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.96);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .error-card {
        background: linear-gradient(145deg, #f5efe4, #e8ddce);
        border-radius: 32px;
        padding: 3rem 2rem 2.8rem;
        box-shadow:
          0 30px 60px -15px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(139, 105, 20, 0.25),
          inset 0 1px 0 rgba(255, 245, 220, 0.6);
        border: 1px solid rgba(212, 197, 169, 0.4);
        text-align: center;
      }

      .error-ornament {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        color: #8b6914;
        font-size: 1.125rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 300;
      }

      .error-ornament::before,
      .error-ornament::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, #b8a082, transparent);
      }

      .error-code {
        font-family: "Inter", sans-serif;
        font-size: 8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #8b6914, #a68a56);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 0.5rem;
        text-shadow: none;
        position: relative;
      }

      .error-code::after {
        content: "";
        position: absolute;
        font-size: 2rem;
        -webkit-text-fill-color: initial;
        color: #8b6914;
        opacity: 0.3;
        top: -10px;
        right: 20px;
      }

      .error-code::before {
        content: "";
        position: absolute;
        font-size: 2rem;
        -webkit-text-fill-color: initial;
        color: #8b6914;
        opacity: 0.3;
        bottom: -10px;
        left: 20px;
      }

      .error-title {
        font-family: "Inter", sans-serif;
        font-size: 2rem;
        color: #5c4033;
        margin-bottom: 0.75rem;
        font-weight: 700;
      }

      .error-desc {
        color: #7a6553;
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 0.5rem;
      }

      .error-desc .highlight {
        color: #8b6914;
        font-weight: 700;
      }

      .error-icon {
        font-size: 4rem;
        margin: 1rem 0;
        display: block;
      }

      .error-btns {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 2rem;
      }

      .btn-primary {
        padding: 0.9rem 2.2rem;
        border: none;
        border-radius: 60px;
        background: linear-gradient(135deg, #8b6914, #a68a56);
        color: #fff;
        font-family: "Inter", sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 20px rgba(139, 105, 20, 0.3);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
      }

      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(139, 105, 20, 0.4);
        background: linear-gradient(135deg, #6b4f0e, #8b6914);
      }

      .btn-secondary {
        padding: 0.9rem 2.2rem;
        border: 2px solid #8b6914;
        border-radius: 60px;
        background: transparent;
        color: #5c4033;
        font-family: "Inter", sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
      }

      .btn-secondary:hover {
        background: #8b6914;
        color: #fff;
        transform: translateY(-3px);
        box-shadow: 0 4px 20px rgba(139, 105, 20, 0.2);
      }

      .error-footer {
        margin-top: 2rem;
        font-size: 1rem;
        color: #8b7355;
        border-top: 1px solid rgba(139, 105, 20, 0.12);
        padding-top: 1.5rem;
      }

      .pixel-icon {
        font-size: 1rem;
        display: inline-block;
        margin: 0 0.25rem;
      }

      /* ===== RESPONSIVO ===== */
      @media (max-width: 480px) {
        .error-card {
          padding: 2rem 1.2rem 2rem;
        }

        .error-code {
          font-size: 5rem;
        }

        .error-title {
          font-size: 1.5rem;
        }

        .error-desc {
          font-size: 1.125rem;
        }

        .btn-primary,
        .btn-secondary {
          padding: 0.7rem 1.5rem;
          font-size: 1.125rem;
          width: 100%;
          justify-content: center;
        }

        .error-btns {
          flex-direction: column;
          align-items: stretch;
        }
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #2a201a;
      }

      ::-webkit-scrollbar-thumb {
        background: #8b6914;
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #a68a56;
      }
    </style>
    <link rel="icon" type="image/png" href="logo.png" />
  </head>

  <body>
    <!-- ═══ VÍDEO DE FUNDO ═══ -->
    <div class="video-bg-container">
      <video autoplay muted loop playsinline preload="auto">
        <source src="vei.mp4" type="video/mp4" />
      </video>
      <div class="video-bg-overlay"></div>
    </div>

    <!-- ═══ CONTEÚDO ═══ -->
    <div class="error-wrapper">
      <div class="error-card">
        <div class="error-ornament">Chronohistory</div>

        <div class="error-code">404</div>

        <span class="error-icon">�️</span>

        <h1 class="error-title">Página Perdida no Tempo</h1>

        <p class="error-desc">
          A rota que você tentou acessar
          <span class="highlight">não existe</span> nesta linha do tempo.
          <br />
          Talvez tenha sido esquecida pelos anais da história...
        </p>

        <div class="error-btns">
          <a href="/" class="btn-primary"> Voltar à Linha do Tempo </a>
        </div>

        <div class="error-footer">
          <span class="pixel-icon">⬥</span>
          Até os grandes impérios se perderam. Tente novamente.
          <span class="pixel-icon">⬥</span>
        </div>
      </div>
    </div>

    <!-- ═══ PARTÍCULAS ═══ -->
    <script>
      (function () {
        const particleSymbols = ["", "", "⬥", "⬦", "◆", "◇", "", "꧁", "꧂", ""];
        const colors = ["#C9A227", "#E8C84A", "#A68A56", "#F5E6C8", "#D4C5A9"];

        function createParticle() {
          const p = document.createElement("div");
          p.className = "medieval-particle";
          p.textContent =
            particleSymbols[Math.floor(Math.random() * particleSymbols.length)];
          p.style.left = Math.random() * 100 + "vw";
          p.style.bottom = "-20px";
          p.style.color = colors[Math.floor(Math.random() * colors.length)];
          const duration = 7 + Math.random() * 12;
          p.style.animationDuration = duration + "s";
          p.style.animationDelay = Math.random() * 5 + "s";
          p.style.fontSize = 8 + Math.random() * 14 + "px";
          document.body.appendChild(p);
          setTimeout(
            () => {
              if (p.parentNode) p.parentNode.removeChild(p);
            },
            (duration + 2) * 1000,
          );
        }

        setInterval(createParticle, 1800);
        for (let i = 0; i < 6; i++) {
          setTimeout(createParticle, i * 350);
        }
      })();
    </script>
  </body>
</html>
